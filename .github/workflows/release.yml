name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python3 -c "import json;print(json.load(open('extension/manifest.json'))['version'])")
          if [ "$TAG" != "$VER" ]; then
            echo "Tag v$TAG does not match manifest version $VER"
            exit 1
          fi

      - name: Syntax check
        run: node --check extension/content.js

      - name: Build zip
        run: |
          mkdir -p dist/super-oneclick-plugin
          cp -r extension/. dist/super-oneclick-plugin/
          cp README.md CHANGELOG.md dist/super-oneclick-plugin/
          (cd dist && zip -r "../super-oneclick-plugin-${GITHUB_REF_NAME}.zip" super-oneclick-plugin)

      - name: Release notes from CHANGELOG
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v h="## $VER" '$0==h{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "super-oneclick-plugin-${GITHUB_REF_NAME}.zip" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
